- name: Install or upgrade Argo CD (version from the BOM)
  ansible.builtin.command: >-
    helm upgrade --install argocd argo-cd
    --repo https://argoproj.github.io/argo-helm
    --version {{ argocdChartVersion }}
    --namespace argocd --create-namespace
    --kubeconfig {{ talos_workdir }}/kubeconfig
    --wait --timeout 10m
  changed_when: false

- name: Render the chart repository and the root Application
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ talos_workdir }}/{{ item }}"
    mode: "0644"
  loop:
    - chart-repo.yaml
    - root-app.yaml

- name: Apply them (repository first)
  ansible.builtin.command: "kubectl --kubeconfig {{ talos_workdir }}/kubeconfig apply -f {{ talos_workdir }}/{{ item }}"
  loop:
    - chart-repo.yaml
    - root-app.yaml
  changed_when: false
